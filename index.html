
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onde Passa o Jogo? - Definitivo</title>
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #16a34a; text-align: center; font-size: 22px; margin-bottom: 20px; }
        .box { background: #f9fafb; border: 1px solid #e5e7eb; padding: 12px; margin-bottom: 15px; border-radius: 6px; }
        .box-chave { background: #fef9c3; border-color: #fef08a; }
        .flex { display: flex; gap: 8px; }
        input { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; }
        button { background: #16a34a; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .tag { background: #dcfce7; color: #166534; padding: 4px 10px; border-radius: 20px; display: inline-block; font-size: 13px; margin: 5px 5px 0 0; }
        .btn-remover { color: red; background: none; border: none; font-weight: bold; cursor: pointer; margin-left: 5px; }
        .card { border: 1px solid #e5e7eb; border-left: 4px solid #16a34a; padding: 12px; border-radius: 6px; background: white; margin-top: 10px; }
        .btn-busca { background: #2563eb; color: white; border: none; padding: 8px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 8px; }
        .resultado { font-size: 13px; margin-top: 8px; color: #374151; background: #f3f4f6; padding: 8px; border-radius: 4px; line-height: 1.4; }
    </style>
    <!--
      Import corrigido: o pacote certo para a API nova (com tools.googleSearch)
      é @google/genai, e o CDN esm.run precisa do nome do pacote no path.
      O import antigo ("@google/generative-ai": "https://esm.run") não resolvia
      para nenhum módulo válido, então o script quebrava silenciosamente no
      "import" logo na primeira linha.

      AVISO: a chave fica salva em localStorage e a chamada à API sai direto
      do navegador. Isso é aceitável para uso local, só seu. Se este arquivo
      for hospedado publicamente ou compartilhado com outras pessoas, qualquer
      uma delas pode abrir o DevTools e roubar sua chave. Para distribuir,
      o certo é mover a chamada da API para um backend (mesmo que seja uma
      function serverless simples) que guarda a chave no servidor.
    -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai"
        }
      }
    </script>
</head>
<body>

    <div class="container">
        <h1>⚽ Onde Passa o Jogo?</h1>

        <div class="box box-chave">
            <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:4px;">🔑 Sua Chave API do Gemini:</label>
            <div class="flex">
                <input id="keyIn" type="password" placeholder="Cole sua chave aqui...">
                <button onclick="salvarChave()" style="background:#ca8a04;">Salvar</button>
            </div>
        </div>

        <div class="box box-chave">
            <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:4px;">⚽ Sua Chave API-Football:</label>
            <div class="flex">
                <input id="keyFootballIn" type="password" placeholder="Cole sua chave aqui...">
                <button onclick="salvarChaveFootball()" style="background:#ca8a04;">Salvar</button>
            </div>
        </div>

        <div class="box">
            <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:4px;">Meus Times Favoritos:</label>
            <div class="flex">
                <input id="teamIn" type="text" placeholder="Ex: Flamengo, Palmeiras">
                <button onclick="adicionarTime()">+</button>
            </div>
            <div id="listaFavs" style="margin-top:10px;"></div>
        </div>

        <h3 style="font-size:14px; color:#4b5563; margin-top:20px;">PARTIDAS PROGRAMADAS</h3>
        <div id="listaJogos"></div>
    </div>

    <script type="module">
        import { GoogleGenAI } from '@google/genai';

        let times = ['Benfica', 'Palmeiras'];
        let chave = '';
        let chaveFootball = '';

        window.onload = function() {
            chave = localStorage.getItem('app_gemini_key') || '';
            if (chave) document.getElementById('keyIn').value = chave;

            chaveFootball = localStorage.getItem('app_football_key') || '';
            if (chaveFootball) document.getElementById('keyFootballIn').value = chaveFootball;
            
            let salvos = localStorage.getItem('app_times');
            if (salvos) times = JSON.parse(salvos);
            
            desenharTela();
        };

        window.salvarChave = function() {
            let valor = document.getElementById('keyIn').value.trim();
            if (valor) {
                localStorage.setItem('app_gemini_key', valor);
                chave = valor;
                alert('Chave salva com sucesso!');
                desenharTela();
            }
        };

        window.salvarChaveFootball = function() {
            let valor = document.getElementById('keyFootballIn').value.trim();
            if (valor) {
                localStorage.setItem('app_football_key', valor);
                chaveFootball = valor;
                alert('Chave salva com sucesso!');
                desenharTela();
            }
        };

        window.adicionarTime = function() {
            let input = document.getElementById('teamIn');
            let nome = input.value.trim();
            if (nome && !times.includes(nome)) {
                times.push(nome);
                localStorage.setItem('app_times', JSON.stringify(times));
                input.value = '';
                desenharTela();
            }
        };

        window.removerTime = function(nome) {
            times = times.filter(t => t !== nome);
            localStorage.setItem('app_times', JSON.stringify(times));
            desenharTela();
        };

        function desenharTela() {
            let divFavs = document.getElementById('listaFavs');
            if (times.length === 0) {
                divFavs.innerHTML = '<span style="color:#9ca3af; font-size:12px;">Nenhum time.</span>';
            } else {
                divFavs.innerHTML = times.map(t => `
                    <span class="tag">${t}<button class="btn-remover" onclick="removerTime('${t}')">×</button></span>
                `).join('');
            }

            let divJogos = document.getElementById('listaJogos');
            if (times.length === 0) {
                divJogos.innerHTML = '<p style="color:#9ca3af; font-size:13px; text-align:center;">Adicione times para ver a agenda.</p>';
                return;
            }

            divJogos.innerHTML = times.map((t, idx) => {
                return `
                    <div class="card">
                        <div style="font-weight:bold; margin-bottom:8px;">${t}</div>
                        <div id="res-${idx}">
                            <button class="btn-busca" id="btn-click-${idx}"> 🔍 Descobrir Próximo Jogo</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Adiciona o evento de clique de forma segura compatível com módulos do navegador
            times.forEach((t, idx) => {
                let btn = document.getElementById(`btn-click-${idx}`);
                if (btn) {
                    btn.onclick = () => buscarIA(t, `res-${idx}`);
                }
            });
        }

        async function buscarProximoJogo(time) {
            // Etapa 1: encontra o ID do time na API-Football pelo nome digitado
            let respTime = await fetch('https://v3.football.api-sports.io/teams?search=' + encodeURIComponent(time), {
                headers: { 'x-apisports-key': chaveFootball }
            });
            let dadosTime = await respTime.json();

            if (!dadosTime.response || dadosTime.response.length === 0) {
                throw new Error('Time não encontrado na base da API-Football.');
            }

            // Prioriza um time cujo nome bata de perto com o texto digitado, evitando
            // escolher de cara uma categoria de base ou feminina que também contenha o nome
            let candidato = dadosTime.response.find(t =>
                t.team.name.toLowerCase() === time.toLowerCase()
            ) || dadosTime.response[0];

            let timeId = candidato.team.id;
            let nomeOficial = candidato.team.name;
            let pais = candidato.team.country;

            // Etapa 2: busca o próximo jogo confirmado desse time, qualquer competição
            let respFixture = await fetch('https://v3.football.api-sports.io/fixtures?team=' + timeId + '&next=1', {
                headers: { 'x-apisports-key': chaveFootball }
            });
            let dadosFixture = await respFixture.json();

            if (!dadosFixture.response || dadosFixture.response.length === 0) {
                throw new Error('Nenhum próximo jogo agendado encontrado para este time.');
            }

            let jogo = dadosFixture.response[0];
            return {
                nomeOficial,
                pais,
                dataISO: jogo.fixture.date,
                adversario: jogo.teams.home.id === timeId ? jogo.teams.away.name : jogo.teams.home.name,
                mandante: jogo.teams.home.name,
                visitante: jogo.teams.away.name,
                competicao: jogo.league.name,
                local: jogo.fixture.venue?.name || ''
            };
        }

        async function buscarIA(time, idElemento) {
            if (!chave) {
                alert('Salve a chave do Gemini primeiro!');
                return;
            }
            if (!chaveFootball) {
                alert('Salve a chave da API-Football primeiro!');
                return;
            }
            let campo = document.getElementById(idElemento);
            campo.innerHTML = '<p style="font-size:12px; color:#6b7280; font-style:italic;">Buscando o próximo jogo confirmado...</p>';

            try {
                // Etapa 1: dados confiáveis do jogo (data, adversário, competição) via API-Football
                let jogo = await buscarProximoJogo(time);
                let dataFormatada = new Date(jogo.dataISO).toLocaleDateString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                campo.innerHTML = '<p style="font-size:12px; color:#6b7280; font-style:italic;">Jogo encontrado! Buscando canais de transmissão...</p>';

                // Etapa 2: só os canais de transmissão, com a data já confirmada como contexto
                let prompt = "O jogo é: " + jogo.mandante + " x " + jogo.visitante +
                    ", pela competição " + jogo.competicao + ", em " + dataFormatada + " (horário de Brasília)" +
                    (jogo.local ? ", no local " + jogo.local : "") +
                    ". Liste todos os canais oficiais onde ESSA partida específica será transmitida no Brasil (TV aberta, TV fechada, streaming e canais oficiais do YouTube). Se não encontrar confirmação de transmissão no Brasil para essa partida, diga isso claramente. Seja objetivo.";

                const ai = new GoogleGenAI({ apiKey: chave });
                const response = await ai.models.generateContent({
                    model: 'gemini-3.1-flash-lite',
                    contents: prompt,
                    tools: [{ googleSearch: {} }]
                });

                let txtCanais = response.text ? response.text.replace(/\*\*/g, '').replace(/\*/g, '•') : 'Nenhuma informação de transmissão encontrada.';

                campo.innerHTML = `
                    <div class="resultado">
                        <b>${jogo.nomeOficial}${jogo.pais ? ' (' + jogo.pais + ')' : ''}</b><br>
                        Próximo jogo: ${jogo.mandante} x ${jogo.visitante}<br>
                        Competição: ${jogo.competicao}<br>
                        Data: ${dataFormatada}<br>
                        <br>
                        <b>Onde assistir:</b><br>
                        ${txtCanais.replace(/\n/g, '<br>')}
                    </div>
                `;
            } catch (e) {
                console.error(e);
                campo.innerHTML = '<p style="color:red; font-size:12px;">Erro: ' + e.message + '</p>';
            }
        }
    </script>
</body>
</html>
